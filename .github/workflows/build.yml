name: Build and package
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore NaverMapSearch.sln
      - name: Build
        run: dotnet build NaverMapSearch.sln -c Release --no-restore
      - name: Test
        run: dotnet test NaverMapSearch.sln -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/Package.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')
          } else {
            ./scripts/Package.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NaverMapSearch
          path: .artifacts/NaverMapSearch-*.zip
          if-no-files-found: error
          # The ZIP is inside a dot-prefixed directory; only this allowlisted ZIP is uploaded.
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
